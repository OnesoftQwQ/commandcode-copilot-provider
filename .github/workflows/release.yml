name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          New version (e.g. 0.2.3). If omitted, only builds without
          version sync.
        required: false
        type: string
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run postinstall script (copy tokenizer)
        run: node scripts/copy-tokenizer.js

      # 确定版本号来源：手动输入 > tag > 无
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "ver=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
            echo "ver=${VER}" >> $GITHUB_OUTPUT
          else
            echo "ver=" >> $GITHUB_OUTPUT
          fi

      # 仅当解析到版本号时才执行同步、推送
      - name: Sync and commit version
        if: steps.ver.outputs.ver != ''
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          echo "Syncing package.json version to ${VER}"
          npm version "$VER" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/hardcodedModelList.ts
          MSG="chore: bump version to ${VER}, sync model list [skip ci]"
          git diff --cached --quiet || git commit -m "$MSG"
          # 优先推送 master（release 流程的版本同步提交应落在 master）；
          # 仅当 master 不含触发提交时回退到其它包含该提交的分支。
          BRANCH=$(git branch -r --contains "$GITHUB_SHA" \
            | sed 's|.*origin/||' | grep -x 'master' | head -1)
          if [ -z "$BRANCH" ]; then
            BRANCH=$(git branch -r --contains "$GITHUB_SHA" \
              | head -1 | sed 's|.*origin/||' | xargs)
          fi
          if [ -n "$BRANCH" ]; then
            git push origin "HEAD:refs/heads/$BRANCH"
          else
            echo "No remote branch found, skipping push."
          fi

      - name: Compile TypeScript
        run: npm run compile

      - name: Package extension (.vsix)
        run: npm run build

      - name: Get version from package.json
        id: version
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=${VER}" >> $GITHUB_OUTPUT

      # 解析要挂载 .vsix 的 Release tag：
      # - release 事件 → 该 Release 的 tag
      # - tag 推送（v*）→ 触发 tag
      # - 手动触发且填了版本号 → v<版本号>
      # - 手动触发未填版本号 → 空（只构建并上传 artifact，不创建 Release）
      - name: Get tag name
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.version }}" ]; then
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=" >> $GITHUB_OUTPUT
          fi

      # 非 release 事件且解析到有效 tag 时创建草稿 Release（含默认介绍）
      - name: Create draft Release (tag push / manual version)
        if: github.event_name != 'release' && steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            # ${{ steps.tag.outputs.tag }}
            [CHANGELOG](https://github.com/OnesoftQwQ/commandcode-copilot-provider)
            了解详细变更。
          draft: true
          prerelease: false
          files: extension.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 已发布的 Release 仅上传 .vsix，不修改用户写的介绍
      - name: Upload .vsix to published Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: extension.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 上传 .vsix 作为 Actions 构建产物（备用）
      - name: Upload .vsix as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: commandcode-copilot-provider-${{ steps.version.outputs.version }}.vsix
          path: extension.vsix
          if-no-files-found: error

      # 发布到 VS Code Marketplace —— 暂时停用：
      # 启用前需先在仓库 Secrets 中配置 VSCE_PAT（VS Marketplace 发布者 PAT），
      # 然后把下面整段注释去掉即可恢复。
      # - name: Publish to VS Code Marketplace
      #   env:
      #     VSCE_PAT: ${{ secrets.VSCE_PAT }}
      #   run: |
      #     npx @vscode/vsce publish -p "$VSCE_PAT" \
      #       --packagePath extension.vsix --allow-all-proposed-apis
